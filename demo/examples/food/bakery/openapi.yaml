openapi: 3.2.0
info:
  title: Bakery Example
  version: 1.0.0
  description: >-
    Demonstrates OpenAPI 3.2 hierarchical tags via the `tags[].parent` field,
    rendered as nested sidebar categories with `groupPathsBy: "tagParent"`,
    and the OpenAPI 3.2 `query` operation (HTTP QUERY method, RFC 10008).
paths:
  /cakes:
    get:
      tags:
        - Cakes
      summary: List Cakes
      description: Return every cake we bake.
      responses:
        200:
          description: OK
  /cakes/search:
    query:
      tags:
        - Cakes
      summary: Search Cakes
      description: >-
        Return the cakes matching the criteria in the request body. Like GET,
        QUERY is safe and idempotent, but it carries its criteria in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flavour:
                  type: string
                  example: chocolate
                maxPrice:
                  type: number
                  example: 25
      responses:
        200:
          description: OK
  /cakes/seasonal:
    get:
      tags:
        - Seasonal Cakes
      summary: List Seasonal Cakes
      description: Return cakes available for the current season.
      responses:
        200:
          description: OK
  /breads:
    get:
      tags:
        - Breads
      summary: List Breads
      description: Return every loaf on the shelf.
      responses:
        200:
          description: OK

tags:
  - name: Products
    description: Everything we sell.
  - name: Cakes
    parent: Products
    description: Cakes of all kinds.
  - name: Seasonal Cakes
    parent: Cakes
    description: Cakes available only at certain times of the year.
  - name: Breads
    parent: Products
    description: Freshly baked breads.
